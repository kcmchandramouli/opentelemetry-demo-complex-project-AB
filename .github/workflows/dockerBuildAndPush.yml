name: Docker Build and Push all services

on:
  push:
    branches:
      - "master"
      - "task/**"
  pull_request:
    branches:
      - "master"
      - "task/**"

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy Installation
        run: |
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install trivy -y

      - name: Trivy Fs Scan
        run: trivy fs --format table -o fs-report.json .

      - name: Upload file-system artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trivy-fs-report
          path: fs-report.json

  get-services:
    runs-on: ubuntu-latest
    needs: security-check
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        name: Find all services in src/
        run: |
          dirs=$(find src -maxdepth 1 -mindepth 1 -type d -printf "%f\n")
          json=$(printf '%s\n' "$dirs" | jq -R . | jq -s -c .)
          echo "services=$json" >> $GITHUB_OUTPUT

  build-and-push:
    needs: get-services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.get-services.outputs.services) }}
      # max-parallel: 1
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Locate Dockerfile
        id: find_dockerfile
        run: |
          SERVICE_DIR="./src/${{ matrix.service }}"
      
          # Search recursively for Dockerfile
          DOCKERFILE=$(find "$SERVICE_DIR" -type f -name "Dockerfile" | head -n 1)
      
          if [ -z "$DOCKERFILE" ]; then
            echo "⏭️ No Dockerfile for ${{ matrix.service }} — skipping build"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
      
          echo "📄 Found Dockerfile: $DOCKERFILE"
          echo "found=true" >> $GITHUB_OUTPUT
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        if: steps.find_dockerfile.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.find_dockerfile.outputs.dockerfile }}
          push: true
          tags: ${{ vars.DOCKERHUB_REPO }}/${{ matrix.service }}-ab:latest
          build-args: |
            OPENTELEMETRY_CPP_VERSION=1.21.0
            OTEL_JAVA_AGENT_VERSION=2.22.0
            TARGETARCH=amd64
            TARGETPLATFORM=linux/amd64
            BUILDPLATFORM=linux/amd64
